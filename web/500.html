<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Внутренняя ошибка сервера</title>
    <!-- Путь к локальному файлу CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 700;
      color: #dc3545; /* Красный цвет для критической ошибки */
      line-height: 1;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center text-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <!-- Иконка шестеренки с ошибкой -->
        <div class="mb-4 text-danger">
          <i class="bi bi-gear-fill display-1 d-inline-block animate-pulse"></i>
        </div>

        <!-- Большие цифры 500 -->
        <h1 class="error-code mb-2">500</h1>

        <h2 class="fw-bold text-dark mb-3">Ошибка на стороне сервера</h2>

        <p class="text-muted mb-4">
          Что-то пошло не так. Мы уже зафиксировали ошибку в логах сервера и постараемся исправить её в ближайшее время. Пожалуйста, попробуйте обновить страницу позже.
        </p>

        <!-- Кнопка «Попробовать снова» (просто перезагружает страницу) -->
        <button onclick="window.location.reload();" class="btn btn-outline-danger px-4 py-2 me-2 shadow-sm">
          <i class="bi bi-arrow-clockwise me-1"></i> Обновить страницу
        </button>

        <!-- Кнопка перехода на главную -->
        <a href="/" class="btn btn-secondary px-4 py-2 shadow-sm">
          На главную
        </a>

      </div>
    </div>
  </div>

</body>
</html>
